<!DOCTYPE html>
<html>
<head>

<title>MEDICAL HEIST - MDCAT Quiz</title>

<style>

body{
    font-family: Georgia, serif;
    background:#fff7ef;
    margin:0;
    color:#333;
}


header{
    background:#ff7a00;
    color:white;
    text-align:center;
    padding:30px;
}


h1{
    font-size:45px;
}


.container{
    width:90%;
    max-width:1100px;
    margin:auto;
}


.timer{
    position:sticky;
    top:0;
    background:white;
    padding:15px;
    text-align:center;
    font-size:25px;
    color:#e65c00;
}



.question{

    background:white;
    margin:20px 0;
    padding:20px;
    border-left:8px solid #ff7a00;
    border-radius:10px;

}



label{

display:block;
margin:10px;

}


.explanation{

display:none;
background:#fff0dd;
padding:15px;
margin-top:15px;
border-radius:8px;

}



button{

background:#ff7a00;
color:white;
border:none;
padding:15px 30px;
border-radius:30px;
font-size:18px;
cursor:pointer;

}


button:hover{

background:#e65c00;

}



#result{

background:white;
padding:20px;
margin:30px 0;
border-left:8px solid green;

}


</style>

</head>


<body>



<header>

<h1>⚕ MEDICAL HEIST</h1>

<p>MDCAT Logical Reasoning - Letter Series Test</p>

</header>




<div class="timer">

Time Left:
<span id="time">30:00</span>

</div>



<div class="container">


<h2>
30 Questions | 1 Mark Each | Total Marks: 30
</h2>



<form id="quiz">



<div id="questions"></div>


<button type="button" onclick="submitQuiz()">
Submit Test
</button>



</form>



<div id="result"></div>



</div>





<script>



let questions=[


["FAG, GAF, HAI, IAH, _____",
["JAK","HAL","HAK","JAI"],
0,
"The first and third letters form reversed pairs. Next pair is J-K."],


["ELFA, GLHA, ILJA, _____, MLNA",
["OLPA","KLMA","LLMA","KLLA"],
1,
"First letters increase by +2 and third letters increase by +2."],


["ABC, BCD, CDE, DEF, _____",
["EFG","FGH","DEG","FEG"],
0,
"Each letter moves forward by one."],


["ACE, GIK, MOQ, _____",
["PRT","SUW","RTV","STU"],
1,
"Letters increase by +2 inside groups."],


["ZYX, WVU, TSR, _____",
["QPO","PQR","RQP","OPQ"],
0,
"Reverse alphabetical triplets."],


["AA, CC, EE, GG, _____",
["HH","II","JJ","KK"],
1,
"Letters increase by +2."],


["JAK, KBL, LCM, MDN, _____",
["OEP","NEO","MEN","PFQ"],
1,
"Every position increases by one."],


["AZ, BY, CX, DW, _____",
["EV","FU","HS","GT"],
0,
"First letter increases, second decreases."],


["AB, BA, CD, DC, EF, _____",
["GH","FE","FG","GE"],
1,
"Each pair is followed by reverse."],


["B,D,F,H,_____",
["I","J","K","L"],
1,
"Pattern is +2."],


["CAT, DBU, ECV, _____",
["FDW","FEW","GEV","FDU"],
0,
"Each letter moves +1."],


["ALA,BLA,CLA,DLA,_____",
["ELA","FLA","ALE","ELE"],
0,
"Only first letter changes."],


["ABA,BCB,CDC,DED,_____",
["EFE","FGF","EEE","FFF"],
0,
"First and third letters remain same."],


["Z,X,V,T,_____",
["S","R","Q","P"],
1,
"Alphabet decreases by 2."],


["AD,EH,IL,MP,_____",
["QT","QS","RT","RS"],
0,
"+4 shift."],


["AAA,CCC,EEE,GGG,_____",
["HHH","III","JJJ","KKK"],
1,
"+2 pattern."],


["PQR,RQP,STU,UTS,_____",
["VWX","WXV","UVW","XWV"],
0,
"Group followed by reverse."],


["BDF,HJL,NPR,_____",
["TVX","TUV","UWY","VXZ"],
0,
"+2 progression."],


["A,E,I,O,_____",
["U","Y","Z","T"],
0,
"Vowels sequence."],


["KLA,MNA,OPA,_____",
["QRA","RQA","PQA","RSA"],
0,
"Alphabetical progression."],


["A,B,D,G,_____",
["J","K","L","I"],
1,
"Gaps increase."],


["ZY,XW,VU,TS,_____",
["RS","RQ","QP","PQ"],
1,
"Reverse pairs."],


["MNP,PQS,STV,_____",
["VYZ","VWY","VXZ","WXY"],
1,
"+1,+2 pattern."],


["AB,CD,EF,GH,_____",
["IJ","JI","JK","KL"],
0,
"Alphabetical pairs."],


["AAB,BBC,CCD,DDE,_____",
["EEF","FFG","EFF","EEE"],
0,
"Double letter followed by next."],


["Z,W,T,Q,_____",
["O","N","P","M"],
1,
"-3 pattern."],


["LM,NO,PQ,RS,_____",
["TU","UV","ST","TV"],
0,
"Pairs move forward."],


["C,F,I,L,_____",
["N","O","P","M"],
1,
"+3 pattern."],


["D,G,J,M,_____",
["P","O","Q","N"],
0,
"+3 pattern."]


];





let box=document.getElementById("questions");



questions.forEach((q,i)=>{


box.innerHTML += `

<div class="question">


<h3>${i+1}. ${q[0]}</h3>


${q[1].map((option,index)=>`

<label>

<input type="radio" name="q${i}" value="${index}">

${option}

</label>


`).join("")}



<div class="explanation" id="exp${i}"></div>



</div>


`;


});







function submitQuiz(){


let score=0;


questions.forEach((q,i)=>{


let selected=document.querySelector(
'input[name="q'+i+'"]:checked'
);



let exp=document.getElementById("exp"+i);



if(selected && Number(selected.value)==q[2]){

score++;

exp.innerHTML=
"✅ Correct<br>"+q[3];

}


else{


exp.innerHTML=
"❌ Correct Answer: "+q[1][q[2]]+
"<br>"+q[3];


}


exp.style.display="block";


});



document.getElementById("result").innerHTML=

`
<h2>Result</h2>

Your Score: ${score}/30

<br>

Percentage: ${(score/30*100).toFixed(2)}%

`;



window.scrollTo(0,document.body.scrollHeight);



}






let time=1800;


let timer=setInterval(()=>{


let min=Math.floor(time/60);

let sec=time%60;


document.getElementById("time").innerHTML=

min+":"+(sec<10?"0":"")+sec;


time--;


if(time<0){

clearInterval(timer);

submitQuiz();

alert("Time Finished");


}



},1000);



</script>




</body>

</html>
